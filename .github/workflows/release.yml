name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (x.y.z)"
        required: true
        default: "0.0.0"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        shell: pwsh
        run: |
          $requested = '${{ github.event.inputs.version }}'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''   # v1.2.3 -> 1.2.3
          } elseif ($requested) {
            $v = $requested                                # manual run
          } else {
            $v = '0.0.0'                                   # branch push: build check only
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $v"

      - name: Test
        shell: pwsh
        run: dotnet test EasyIntercept.Tests --nologo

      # Inno Setup 6 is preinstalled on windows-latest runners.
      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: EasyIntercept-Setup-${{ env.VERSION }}
          path: dist/EasyIntercept-Setup-*.exe

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EasyIntercept-Setup-*.exe
          generate_release_notes: true
