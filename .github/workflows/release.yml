name: Release

# Releases are driven by the version in EasyIntercept/EasyIntercept.csproj:
#   - push to main with a <Version> that has no tag yet  -> tag it, build both installers, publish the release
#   - push to main without a version change                -> nothing (the version job exits early)
#   - push of a v* tag by hand                             -> build + publish for that tag (still supported)
#   - manual run                                           -> build only, installers as downloadable artifacts
# Tagging and building happen in the same run on purpose: a tag pushed with the workflow's own token
# does not trigger other workflows, so a separate tag-triggered build would never start.
#
# Assets: EasyIntercept-Setup-<version>.exe (Windows, Inno Setup) and EasyIntercept-<version>-arm64.dmg
# (macOS, Apple Silicon). The macOS build is ad-hoc signed unless the signing secrets below are set.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (x.y.z); no release is published"
        required: true
        default: "0.0.0"

permissions:
  contents: write

# Serialise runs so two quick merges cannot both try to tag the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and whether to publish
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
            echo "tag push: releasing $version"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
            publish=false
            echo "manual run: building $version, no release"
          else
            version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' EasyIntercept/EasyIntercept.csproj)
            if [[ -z "$version" ]]; then echo "no <Version> in csproj" >&2; exit 1; fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
              publish=false
              echo "v$version already exists: nothing to release"
            else
              publish=true
              echo "new version $version: will tag and release"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  windows-installer:
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        shell: pwsh
        run: dotnet test EasyIntercept.Tests --nologo

      # Inno Setup 6 is preinstalled on windows-latest runners.
      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: EasyIntercept-Setup-${{ env.VERSION }}
          path: dist/EasyIntercept-Setup-*.exe

  macos-installer:
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest   # Apple Silicon; Xcode provides swiftc, hdiutil and notarytool
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Secrets cannot be tested in `if:` directly; presence of the certificate decides whether to sign.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test EasyIntercept.Tests --nologo

      # Optional: a "Developer ID Application" certificate as base64 .p12. Without it the disk image is
      # ad-hoc signed and users have to allow the app once in System Settings (see README).
      - name: Import signing identity
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          [[ -n "$identity" ]] || { echo "No Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./build-macos.sh --version "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: EasyIntercept-${{ env.VERSION }}-macos
          path: dist/EasyIntercept-*.dmg

      - name: Remove signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

  publish:
    needs: [version, windows-installer, macos-installer]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tag (main push only)
        if: github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION" -m "EasyIntercept $VERSION"
          git push origin "v$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          assets=(dist/EasyIntercept-Setup-*.exe dist/EasyIntercept-*.dmg)
          ls -l "${assets[@]}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --generate-notes
          fi
